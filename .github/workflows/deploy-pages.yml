name: Deploy Static Snapshot to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Mon-Fri 23:30 UTC (after US market close: 18:30 EST / 19:30 EDT)
    - cron: "30 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: pip install -e ./backend

      - name: Build single-file frontend template
        working-directory: frontend
        run: |
          npm ci
          npm run build:static

      - name: Restore accumulated SQLite database cache
        uses: actions/cache@v4
        with:
          path: data/valuation.db
          key: valuation-db-v2-${{ github.run_id }}
          restore-keys: |
            valuation-db-v2-

      - name: Seed history, refresh live valuation, and export Pages site
        env:
          VALUATION_DATA_DIR: ${{ github.workspace }}/data
          VALUATION_DB_PATH: ${{ github.workspace }}/data/valuation.db
          VALUATION_SINGLEFILE_DIST: ${{ github.workspace }}/frontend/dist-singlefile
        run: |
          python -m app.jobs seed --all
          python -m app.jobs backfill-history --all --years 20 || true
          python -m app.jobs refresh --instrument NDX
          python -m app.jobs refresh --instrument SPY || true
          python -m app.jobs backfill-equities --years 15 || true
          python -m app.jobs refresh-equities || true
          python -m app.jobs export --output _site/index.html
          cp _site/index.html _site/ndx-valuation-snapshot.html
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
